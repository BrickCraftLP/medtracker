<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedTracker" />
    <meta name="theme-color" content="#F2F2F7" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>MedTracker</title>
    <script>
      (function() {
        // `medtracker-mode` is the live key; `medtracker-theme` is the legacy
        // one ThemeContext migrates away and then deletes — so read mode first,
        // otherwise every launch after the migration falls back to 'system'.
        var t = localStorage.getItem('medtracker-mode')
             || localStorage.getItem('medtracker-theme')
             || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        // Match the browser/status-bar chrome to the app background to avoid a
        // white bar above the header (dark mode) or a mismatched white (light mode).
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#F2F2F7');
      })();
    </script>
    <style>
      /* Boot loader — inline so it paints from the parsed HTML alone, before
         any stylesheet or module request resolves. React dismisses it via
         hideBootLoader() (src/utils/bootLoader.js) once real content is up. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F2F2F7;
        transition: opacity 200ms ease-out;
      }
      html[data-theme="dark"] #boot-loader { background: #000000; }
      #boot-loader.boot-loader-hide { opacity: 0; }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(60, 60, 67, 0.18);
        border-top-color: #007AFF;
        /* Held invisible for 140ms: a warm boot paints before that and the
           user never sees a spinner flash. */
        opacity: 0;
        animation: boot-spin 1.1s linear infinite, boot-fade-in 120ms ease-out 140ms forwards;
      }
      html[data-theme="dark"] .boot-spinner {
        border-color: rgba(84, 84, 88, 0.55);
        border-top-color: #0A84FF;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-fade-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: boot-fade-in 120ms ease-out 140ms forwards; }
      }
      /* Rotating tip under the spinner — only revealed once the boot is slow
         enough to be worth explaining (see the script below). */
      #boot-loader { flex-direction: column; gap: 18px; padding: 0 32px; }
      .boot-tip {
        margin: 0;
        max-width: 280px;
        min-height: 34px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        color: #6C6C70;
        opacity: 0;
        transition: opacity 300ms ease-out;
      }
      html[data-theme="dark"] .boot-tip { color: #8E8E93; }
      .boot-tip.boot-tip-show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="boot-spinner"></div>
      <p class="boot-tip" id="boot-tip"></p>
    </div>
    <script>
      (function() {
        // Same copy as `firstLoad.tips` in src/i18n — duplicated deliberately,
        // since this runs before any module loads. Keep the two in sync.
        var TIPS = {
          de: [
            'Nach links oder rechts wischen, um Tabs zu wechseln',
            'Auf Home gedrückt halten, um Widgets neu anzuordnen',
            'Auf ein Thema tippen, um eine Lernsession zu starten',
            'Deine Daten werden automatisch geräteübergreifend synchronisiert'
          ],
          en: [
            'Swipe left or right to switch tabs',
            'Long-press Home to rearrange your widgets',
            'Tap a topic to start a study session',
            'Your data syncs automatically across devices'
          ]
        };
        var list = TIPS[localStorage.getItem('mt_language')] || TIPS.de;
        var el = document.getElementById('boot-tip');
        var i = Math.floor(Math.random() * list.length);
        var timer;

        function show() {
          if (!document.getElementById('boot-loader')) { clearInterval(timer); return; }
          el.classList.remove('boot-tip-show');
          setTimeout(function() {
            el.textContent = list[i % list.length];
            i++;
            el.classList.add('boot-tip-show');
          }, 300);
        }

        // Only worth showing when the boot is actually slow — a warm launch is
        // done long before this fires and never shows a tip at all.
        setTimeout(function() {
          if (!document.getElementById('boot-loader')) return;
          el.textContent = list[i++ % list.length];
          el.classList.add('boot-tip-show');
          timer = setInterval(show, 2600);
        }, 900);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
