name = "medtracker"
account_id = "c8a0d1306ad7864d9da8407c5931ff24"
compatibility_date = "2025-05-18"
compatibility_flags = ["nodejs_compat"]
# Only proxies the on-device assistant's model files (/hf/*, /ghraw/*);
# everything else is served straight from ./dist without touching the Worker.
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/hf/*", "/ghraw/*"]
